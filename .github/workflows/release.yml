name: Windows, Linux, Android and Browser Extension Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: auto-asmr
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain 1.95.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: auto-asmr -> target
          key: windows-x64-rust-1.95.0

      - name: Run tests
        run: cargo +1.95.0 test --release --locked --target x86_64-pc-windows-msvc

      - name: Build Windows EXE
        run: cargo +1.95.0 build --release --locked --target x86_64-pc-windows-msvc

      - name: Verify EXE starts
        run: |
          $exe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/auto-asmr.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--help' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE smoke test failed: $($process.ExitCode)" }

      - name: Package release
        run: |
          New-Item -ItemType Directory -Path '../dist' -Force | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/auto-asmr.exe' '../dist/auto-asmr.exe'
          Compress-Archive -Path '../dist/auto-asmr.exe', 'README.md', '../doc' -DestinationPath '../dist/auto-asmr-windows-x64.zip' -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auto-asmr-windows-x64
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Test and build Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: auto-asmr
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxi-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libegl1-mesa-dev

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup target add x86_64-unknown-linux-gnu --toolchain 1.95.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: auto-asmr -> target
          key: linux-x64-rust-1.95.0

      - name: Run tests
        run: cargo +1.95.0 test --release --locked --target x86_64-unknown-linux-gnu

      - name: Build Linux binary
        run: cargo +1.95.0 build --release --locked --target x86_64-unknown-linux-gnu

      - name: Verify binary starts
        run: ./target/x86_64-unknown-linux-gnu/release/auto-asmr --help

      - name: Package release
        run: |
          mkdir -p ../dist
          tar -czf ../dist/auto-asmr-linux-x64.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release auto-asmr \
            -C "$GITHUB_WORKSPACE/auto-asmr" README.md \
            -C "$GITHUB_WORKSPACE" doc

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auto-asmr-linux-x64
          path: dist/auto-asmr-linux-x64.tar.gz
          if-no-files-found: error

  build-android:
    name: Test and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: auto-asmr-android
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.2" "build-tools;36.0.0" "cmake;3.31.6" "ndk;29.0.14206865" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 安卓和插件的 Rust 代码是在最新稳定版上开发、测试的，用 stable（桌面版两个任务仍固定 1.95.0）
      - name: Install Rust stable with Android targets
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add aarch64-linux-android armv7-linux-androideabi --toolchain stable
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: auto-asmr-android/rust -> target
          key: android-rust-stable

      - name: Run Rust tests
        run: cargo test --release --locked --manifest-path rust/Cargo.toml

      # 签名密钥放在仓库的 Secrets 里（做法见 doc/android-dev.md）；没配时用临时调试密钥签名，装得上，但每次构建的密钥都不同，
      # 不能覆盖安装之前的版本
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ASMR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::没有配置 ANDROID_KEYSTORE_BASE64，APK 用临时调试密钥签名，不能覆盖安装之前的版本"
          fi

      - name: Build APK
        env:
          ASMR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ASMR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ASMR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ASMR_VERSION_NAME: ${{ github.ref_name }}
          ASMR_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      # 两种架构都要有网页模式的 libasmrhook.so 和全局模式服务进程的 libasmrglobal.so；
      # 按名字加载 / JNI 找的类（NativeHook、global.server 包）不能被 R8 改名
      - name: Check APK
        run: |
          python3 - app/build/outputs/apk/release/app-release.apk <<'EOF'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = set(z.namelist())
          libs = [f"lib/{abi}/{lib}" for abi in ("arm64-v8a", "armeabi-v7a") for lib in ("libasmrhook.so", "libasmrglobal.so")]
          missing = [n for n in libs + ["assets/ku100.bin", "assets/pinna.bin"] if n not in names]
          assert not missing, f"包里缺少：{missing}"
          dex = b"".join(z.read(n) for n in names if n.startswith("classes") and n.endswith(".dex"))
          classes = ["io/github/nasuiyile/autoasmr/NativeHook"] + [
              f"io/github/nasuiyile/autoasmr/global/server/{c}" for c in ("EngineService", "ServerMain", "Engine", "LatencyProbe")]
          lost = [c for c in classes if f"L{c};".encode() not in dex]
          assert not lost, f"这些类被 R8 改名或删掉了（见 app/proguard-rules.pro）：{lost}"
          print(f"{len(names)} 个文件，两种架构的引擎 .so 和按名字加载的类都在")
          EOF

      - name: Package release
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/auto-asmr-android.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auto-asmr-android
          path: dist/auto-asmr-android.apk
          if-no-files-found: error

  build-chromium:
    name: Test and build browser extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: auto-asmr-chromium
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install Rust stable with the wasm target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain stable
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: auto-asmr-chromium/wasm -> target
          key: chromium-rust-stable

      - name: Run Rust tests
        working-directory: auto-asmr-chromium/wasm
        run: cargo test --release --locked

      # tag 是 v1.2.3 / 1.2.3 这样的数字版本时写进 manifest.json（Chrome 只认 1–4 段数字）；否则保留原来的版本号
      - name: Set extension version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          tag = re.sub(r"^[vV]", "", os.environ["TAG"])
          path = "extension/manifest.json"
          with open(path, encoding="utf-8") as f:
              manifest = json.load(f)
          if re.fullmatch(r"\d+(\.\d+){0,3}", tag):
              manifest["version"] = tag
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(manifest, f, ensure_ascii=False, indent=2)
                  f.write("\n")
          print("manifest version:", manifest["version"])
          EOF

      - name: Build wasm and package extension
        run: ./build.sh --zip

      # 包里要有 manifest、引擎（wasm 文件头 \0asm）和 manifest 里引用到的页面、脚本、图标
      - name: Check package
        run: |
          python3 - <<'EOF'
          import json, zipfile
          z = zipfile.ZipFile("dist/auto-asmr-chromium.zip")
          names = set(z.namelist())
          manifest = json.loads(z.read("manifest.json"))
          assert z.read("asmr.wasm")[:4] == b"\0asm", "asmr.wasm 不是 wasm 文件"
          refs = [manifest["background"]["service_worker"], manifest["action"]["default_popup"], manifest["options_ui"]["page"]]
          refs += list(manifest["icons"].values()) + list(manifest["action"]["default_icon"].values())
          missing = [r for r in refs if r not in names]
          assert not missing, f"包里缺少：{missing}"
          print(f"{len(names)} 个文件，版本 {manifest['version']}，asmr.wasm {z.getinfo('asmr.wasm').file_size / 1e6:.1f} MB")
          EOF

      - name: Package release
        run: |
          mkdir -p ../dist
          cp dist/auto-asmr-chromium.zip ../dist/auto-asmr-chromium.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auto-asmr-chromium
          path: dist/auto-asmr-chromium.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-android, build-chromium]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: auto-asmr-*
          merge-multiple: true
          path: dist

      - name: Generate checksums for all platforms
        working-directory: dist
        run: sha256sum auto-asmr.exe auto-asmr-windows-x64.zip auto-asmr-linux-x64.tar.gz auto-asmr-android.apk auto-asmr-chromium.zip > SHA256SUMS.txt

      - name: Publish Windows, Linux, Android and browser extension packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/auto-asmr.exe
            dist/auto-asmr-windows-x64.zip
            dist/auto-asmr-linux-x64.tar.gz
            dist/auto-asmr-android.apk
            dist/auto-asmr-chromium.zip
            dist/SHA256SUMS.txt
