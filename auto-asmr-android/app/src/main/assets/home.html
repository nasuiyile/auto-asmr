<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auto-asmr</title>
<style>
  :root { color-scheme: light dark; --fg: #1c1b1f; --muted: #5f5c66; --card: #f3eff7; --accent: #6750a4; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e1e5; --muted: #c9c4d0; --card: #2b2930; --accent: #d0bcff; } }
  body { font: 16px/1.6 sans-serif; margin: 0; padding: 20px 16px; color: var(--fg); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 4px 0 16px; }
  a.site { display: block; background: var(--card); color: var(--fg); text-decoration: none; border-radius: 12px; padding: 14px 16px; margin: 10px 0; }
  a.site b { color: var(--accent); }
  .links { font-size: 14px; color: var(--muted); margin-top: 20px; }
  .links a { color: var(--accent); font-weight: bold; text-decoration: none; }
  ul { padding-left: 20px; color: var(--muted); }
</style>
</head>
<body>
<h1>auto-asmr</h1>
<p>打开任意网页播放，声音会实时做成 KU100 双耳 ASMR 效果。请戴耳机听。</p>
<a class="site" href="https://www.bilibili.com"><b>哔哩哔哩</b><br>自动用桌面版网页，可以直接在网页里播放</a>
<a class="site" href="https://m.youtube.com"><b>YouTube</b></a>
<a class="site" href="https://appassets.androidplatform.net/assets/test.html"><b>测试页</b><br>几种出声方式各试一下</a>
<ul>
  <li>底栏的开关切换「ASMR 效果 / 原声」，点「效果」调参数，和电脑版的参数一样。</li>
  <li>本身就是双耳录音的视频（很多 ASMR 视频是 KU100 录的），切到原声听。</li>
  <li>只放当前标签页的声音；在「标签」里点 📍 可以让某个标签页一直出声。</li>
  <li>配置文件和电脑版通用：菜单里导入 / 导出。</li>
</ul>
<p class="links">GitHub <a href="https://github.com/nasuiyile/auto-asmr">给个star</a> · 研发人 B站 <a href="bilibili://space/79356601">随意Official</a></p>
</body>
</html>
