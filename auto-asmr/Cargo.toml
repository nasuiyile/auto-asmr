[package]
name = "auto-asmr"
version = "0.1.0"
edition = "2021"
description = "KU100 双耳 ASMR 空间化：实时（主播用）+ 音频文件转换，纯 CPU"

# 库（src/lib.rs）只有信号处理 `dsp`，安卓版也用它；程序（src/main.rs）是桌面版的界面和命令行。
# 安卓版以 default-features = false 依赖本包，只编译库，不带音频设备、界面这些桌面依赖。
[lib]
name = "auto_asmr"
path = "src/lib.rs"

[[bin]]
name = "auto-asmr"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["files", "dep:cpal", "dep:eframe", "dep:rfd", "dep:png", "dep:winresource"]
# 文件转换（解码、转换、批量、多音频合成）：库里的 `offline`、`batch`。安卓版也打开它（文件转换页）
files = ["dep:symphonia", "dep:hound"]
# 数据文件不编进程序，运行时用 dsp::data::provide 提供（安卓版用：数据放在 APK 资源里，各 CPU 架构共用一份）
external-data = []

[dependencies]
# DSP
rustfft = "6.4"
realfft = "3.5"
nnnoiseless = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# 音频输入输出。realtime：Windows 上把音频输入 / 输出线程注册到 MMCSS（实时优先级），别的程序占满 CPU
# （比如 RVC 变声器在推理）时不被挤掉而断流；macOS 的 CoreAudio 线程本来就是实时的，Linux 上不带 D-Bus 时不起作用
cpal = { version = "0.18", optional = true, features = ["realtime"] }
symphonia = { version = "0.5", features = ["all"], optional = true }
hound = { version = "3.5", optional = true }
# 界面
eframe = { version = "0.37", features = ["persistence", "glow"], optional = true }
rfd = { version = "0.18", optional = true }
png = { version = "0.18", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 2

# Windows 版 exe 的文件图标（assets/icon.ico，见 build.rs）；只有桌面版用
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", optional = true }
